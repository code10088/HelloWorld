# /etc/nginx/sites-available/aiserver
# 使用前替换：
#   game.example.com                     -> 你的域名（没域名就填 112.126.84.17）
#   /etc/letsencrypt/live/...            -> certbot 实际生成的证书路径
#
# 有域名：certbot --nginx -d game.example.com
# 纯 IP：按 README 用 shortlived profile 申请，证书路径一般是
#   /etc/letsencrypt/live/ip-112-126-84-17/

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;

    # certbot webroot 校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 客户端只用到这两个接口
    location /auth/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5080;
    }

    location / {
        return 404;
    }
}