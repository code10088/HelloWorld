# 申请 IP 证书（或域名证书）之前先用这个 80 端口配置
# 因为 certbot 的 HTTP-01 校验要通过 http://<IP>/.well-known/acme-challenge/
# 此时还没有证书，不能直接启用带 443 的 nginx-aiserver.conf
#
# 使用方法：
#   sudo cp /opt/aiserver/deploy/nginx-bootstrap-http.conf /etc/nginx/sites-available/aiserver
#   sudo ln -s /etc/nginx/sites-available/aiserver /etc/nginx/sites-enabled/aiserver
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/html
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书签发成功后再换回 nginx-aiserver.conf

server {
    listen 80;
    listen [::]:80;
    server_name 112.126.84.17;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        default_type text/plain;
        return 200 "aiserver bootstrap\n";
    }
}