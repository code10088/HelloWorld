# /etc/nginx/sites-available/aiserver
# 本机实际部署：IP 证书（Let's Encrypt shortlived）
server {
    listen 80;
    listen [::]:80;
    server_name 112.126.84.17;

    # certbot HTTP-01 / 续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 112.126.84.17;

    ssl_certificate     /etc/letsencrypt/live/ip-112-126-84-17/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-112-126-84-17/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 客户端只用到这两个接口
    location /auth/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5080;
    }

    location / {
        return 404;
    }
}