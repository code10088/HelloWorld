syntax = "proto3";

option csharp_namespace = "Message";

message FriendInfo
{
	uint32 playerId = 1;
	string nickName = 2;
	string avatar = 3;
	uint32 level = 4;
	string remark = 5;
}

message FriendApplyInfo
{
	uint32 playerId = 1;
	string nickName = 2;
	string avatar = 3;
	uint32 level = 4;
	int64 time = 5;
}

message SearchPlayerInfo
{
	uint32 playerId = 1;
	string nickName = 2;
	string avatar = 3;
	uint32 level = 4;
	uint32 relation = 5; //0陌生人 1好友
}

message CSFriendList
{
}
message SCFriendList
{
	repeated FriendInfo friends = 1;
}

message CSFindFriend
{
	string nickName = 1;
}
message SCFindFriend
{
	repeated SearchPlayerInfo players = 1;
}

message CSAddFriend
{
	uint32 playerId = 1;
}
message SCAddFriend
{
	int32 code = 1;
	uint32 playerId = 2;
}

message CSFriendApplyList
{
}
message SCFriendApplyList
{
	repeated FriendApplyInfo applies = 1;
}

message CSHandleFriendApply
{
	uint32 playerId = 1;
	uint32 handle = 2; //1同意 2忽略
}
message SCHandleFriendApply
{
	int32 code = 1;
	uint32 playerId = 2;
	uint32 handle = 3;
}

message CSAcceptAllFriendApply
{
}
message SCAcceptAllFriendApply
{
	int32 code = 1;
	uint32 count = 2;
}

message CSDeleteFriend
{
	uint32 playerId = 1;
}
message SCDeleteFriend
{
	int32 code = 1;
	uint32 playerId = 2;
}

message CSSetFriendRemark
{
	uint32 playerId = 1;
	string remark = 2;
}
message SCSetFriendRemark
{
	int32 code = 1;
	uint32 playerId = 2;
	string remark = 3;
}