plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'com.qs.helloworld.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 21
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.android.support:support-fragment:28.0.0'
    compileOnly 'androidx.credentials:credentials:1.6.0'
    compileOnly 'androidx.credentials:credentials-play-services-auth:1.6.0'
    compileOnly 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}